## Namespace for the operator
namespace: doppler-operator-system

## Controller manager image
## tag defaults to the chart's appVersion when not set
image:
  repository: dopplerhq/kubernetes-operator
  tag: ""
  pullPolicy: IfNotPresent

## Number of controller manager replicas
replicaCount: 1

## Resource requests and limits for the controller manager container
resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 256Mi

## Node selector for the controller manager pods
nodeSelector: {}

## Tolerations for the controller manager pods
tolerations: []

## Affinity rules for the controller manager pods
affinity: {}

## Leader election enables HA by ensuring only one active controller
leaderElect: true

## ServiceAccount configuration
serviceAccount:
  ## Annotations to add to the service account
  annotations: {}

## Secrets Store CSI Driver provider (optional)
## Uses the same image as the operator. Requires the Secrets Store CSI Driver
## to be installed in the cluster.
## See: https://secrets-store-csi-driver.sigs.k8s.io/getting-started/installation
csiProvider:
  enabled: false
  resources:
    limits:
      cpu: 50m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
